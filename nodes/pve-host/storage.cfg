dir: local
	path /var/lib/vz
	content vztmpl,iso
	shared 0

zfspool: local-zfs
	pool rpool/data
	content images,rootdir
	sparse 1

zfspool: pool
	pool pool
	content images
	mountpoint /pool
	sparse 0

dir: backups
	path /pool/backups
	content vztmpl,iso,backup
	prune-backups keep-last=10
	shared 0

dir: External-Hdd
	path /mnt/pve/External-Hdd
	content backup
	is_mountpoint 1
	nodes pve
	prune-backups keep-last=4
	shared 0
