arch: amd64
cores: 4
cpuunits: 512
features: nesting=1
hostname: MusicServer
memory: 512
mp0: /pool/data/media/music,mp=/mnt/data/,shared=1
net0: name=eth0,bridge=vmbr1,hwaddr=52:54:00:AA:00:10,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-zfs:subvol-202-disk-0,size=3G
startup: order=16
swap: 512
lxc.cap.drop: sys_module sys_time mac_admin mac_override sys_ptrace sys_boot sys_rawio
lxc.cgroup2.pids.max: 256
lxc.cgroup2.memory.max: 1536M
lxc.cgroup2.memory.swap.max: 512M
lxc.cgroup2.blkio.weight: 300
