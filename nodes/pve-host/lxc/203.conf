# Fix%3A Passthrough nodes without mode/gid flags (since it's privileged)
# Keep your mountpoints
# Add these standard GPU hooks for PVE 8
arch: amd64
cores: 2
dev0: /dev/dri/card0
dev1: /dev/dri/renderD128
features: nesting=1,fuse=1,keyctl=1,mount=nfs
hostname: media-server
memory: 8192
mp6: /pool/data/media/movies,mp=/mnt/data/media/movies
mp7: /pool/data/media/music,mp=/mnt/data/media/music
mp9: /pool/data/media/series,mp=/mnt/data/media/series
net0: name=eth0,bridge=vmbr2,hwaddr=52:54:00:AA:00:11,ip=dhcp,tag=10,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-zfs:subvol-203-disk-0,size=32G
unprivileged: 0
lxc.cgroup2.devices.allow: c 226:0 rwm
lxc.cgroup2.devices.allow: c 226:128 rwm
