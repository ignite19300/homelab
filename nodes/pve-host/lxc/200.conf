#turnkey samba    192.168.10.20
#filebrowser      192.168.10.20%3A8081
#radicale         192.168.10.20%3A5232
#rclone           192.168.10.20%3A8082
arch: amd64
cores: 2
cpuunits: 2048
features: nesting=1
hostname: file-stack
memory: 512
mp0: /pool/data,mp=/mnt/data
mp1: /pool/data/Bea,mp=/mnt/data/Bea
mp10: /pool/data/media/torrents,mp=/mnt/data/media/torrents
mp11: /pool/data/media/videos,mp=/mnt/data/media/videos
mp2: /pool/data/documents,mp=/mnt/data/documents
mp3: /pool/data/media,mp=/mnt/data/media
mp4: /pool/data/server-stuff,mp=/mnt/data/server-stuff
mp6: /pool/data/media/movies,mp=/mnt/data/media/movies
mp7: /pool/data/media/music,mp=/mnt/data/media/music
mp8: /pool/data/media/photos,mp=/mnt/data/media/photos
mp9: /pool/data/media/series,mp=/mnt/data/media/series
net0: name=eth0,bridge=vmbr2,firewall=1,hwaddr=52:54:00:AA:00:09,ip=dhcp,tag=10,type=veth
onboot: 1
ostype: alpine
rootfs: local-zfs:subvol-200-disk-0,size=8G
startup: order=5
swap: 512
lxc.cap.drop: sys_module sys_time mac_admin mac_override sys_ptrace sys_boot sys_rawio
lxc.cgroup2.pids.max: 512
lxc.cgroup2.memory.max: 1024M
lxc.cgroup2.memory.swap.max: 512M
