arch: amd64
cores: 4
features: nesting=1,keyctl=1
hostname: Docker
memory: 4096
mp0: /pool/data/media,mp=/mnt/data/media
mp10: /pool/data/media/torrents,mp=/mnt/data/media/torrents
mp2: /pool/data/media/movies,mp=/mnt/data/media/movies
mp3: /pool/data/media/music,mp=/mnt/data/media/music
mp4: /pool/data/media/photos,mp=/mnt/data/media/photos
mp5: /pool/data/media/series,mp=/mnt/data/media/series
net0: name=eth0,bridge=vmbr2,firewall=1,hwaddr=52:54:00:AA:00:12,ip=dhcp,tag=10,type=veth
onboot: 1
ostype: alpine
rootfs: local-zfs:subvol-300-disk-0,size=20G
swap: 1024
lxc.apparmor.profile: unconfined
lxc.cap.drop: 
lxc.cgroup2.devices.allow: c 226:0 rwm
lxc.cgroup2.devices.allow: c 226:128 rwm
lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
lxc.autodev: 1
lxc.hook.autodev: sh -c "mknod -m 666 ${LXC_ROOTFS_MOUNT}/dev/fuse c 10 229"
