arch: amd64
cores: 1
cpuunits: 512
features: nesting=1
hostname: password-manager
memory: 512
net0: name=eth0,bridge=vmbr2,hwaddr=52:54:00:AA:00:07,ip=dhcp,tag=10,type=veth
onboot: 1
ostype: alpine
rootfs: local-zfs:subvol-110-disk-0,size=307M
startup: order=4
swap: 256
lxc.cap.drop: sys_module sys_time mac_admin mac_override sys_ptrace sys_boot sys_rawio
lxc.cgroup2.pids.max: 128
lxc.cgroup2.memory.max: 178M
lxc.cgroup2.memory.swap.max: 128M
lxc.cgroup2.blkio.weight: 100
lxc.seccomp.profile: /usr/share/lxc/config/common.seccomp
