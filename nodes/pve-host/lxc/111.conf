arch: amd64
cores: 1
cpuunits: 2048
features: nesting=1
hostname: tunnel-relay
memory: 512
net0: name=eth0,bridge=vmbr2,hwaddr=52:54:00:AA:00:08,ip=dhcp,tag=10,type=veth
onboot: 1
ostype: debian
rootfs: local-zfs:subvol-111-disk-0,size=2G
startup: order=3
swap: 512
lxc.cap.drop: sys_module sys_time mac_admin mac_override sys_ptrace sys_boot sys_rawio
lxc.cgroup2.pids.max: 128
lxc.cgroup2.memory.max: 1024M
lxc.cgroup2.memory.swap.max: 512M
lxc.cgroup2.blkio.weight: 100
